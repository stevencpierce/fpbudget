# Alembic config (audit H5, 2026-07-20). The real DB URL comes from the
# DATABASE_URL env var (see alembic/env.py) — the value below is only the
# local-dev/offline fallback, mirroring app.py's default.
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///fp_budget.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
