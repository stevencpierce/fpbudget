<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FP Upload">
  <link rel="manifest" href="{{ url_for('static', filename='upload-manifest.json') }}">
  <link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='upload-icon-192.png') }}">
  <link rel="apple-touch-icon" sizes="512x512" href="{{ url_for('static', filename='upload-icon-512.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='upload-icon-192.png') }}">
  <title>FP Upload</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0d0f14; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8e9ec;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-tap-highlight-color: transparent;
    }

    .topbar {
      background: #161920; border-bottom: 1px solid #2a2d36;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-logo { font-size: 16px; font-weight: 700; }
    .topbar-logo span { color: #5b8af9; }
    .topbar-right { margin-left: auto; }
    .btn-sm {
      background: #1e2230; color: #b0b8c8; border: 1px solid #2a2d36;
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      text-decoration: none;
    }

    .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }

    .page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .page-sub   { font-size: 13px; color: #6b7280; margin-bottom: 18px; }

    /* ── Project picker ── */
    .field-label {
      font-size: 11px; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .project-select {
      width: 100%; padding: 14px 12px;
      background: #161920; color: #e8e9ec;
      border: 1px solid #2a2d36; border-radius: 10px;
      font-size: 16px;  /* ≥16px prevents iOS zoom */
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236b7280' d='M6 8L0 0h12z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }
    .no-projects {
      background: #2a1414; color: #ef4444; border: 1px solid #4a2020;
      padding: 14px; border-radius: 10px; font-size: 14px;
    }

    /* ── Upload buttons ── */
    .btn-stack { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .btn-big {
      width: 100%; padding: 18px;
      background: #1e2230; border: 1px solid #2a2d36; color: #e8e9ec;
      border-radius: 12px; font-size: 16px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-big:active { background: #242838; }
    .btn-big.primary {
      background: #1a2540; border-color: #2d4070; color: #7fa6ff;
    }
    .btn-big.primary:active { background: #1e2d50; }
    .btn-big .ico { font-size: 22px; }
    .btn-big:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Drop zone (desktop only) ── */
    .drop-zone {
      display: none;
      margin-top: 14px;
      border: 2px dashed #2a2d36; border-radius: 12px;
      padding: 28px 20px; text-align: center;
      cursor: pointer; transition: border-color .2s, background .2s;
      background: #111318;
      position: relative;
    }
    .drop-zone.drag-over { border-color: #5b8af9; background: #131824; }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .drop-icon { font-size: 28px; margin-bottom: 6px; }
    .drop-primary { font-size: 14px; font-weight: 600; color: #d0d5e0; }
    .drop-secondary { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .drop-secondary span { color: #5b8af9; }
    @media (hover: hover) and (pointer: fine) {
      .drop-zone { display: block; }
    }

    /* ── Queue ── */
    .queue { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .queue-item {
      background: #161920; border: 1px solid #2a2d36; border-radius: 10px;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .queue-row {
      display: flex; align-items: center; gap: 12px;
    }
    .queue-thumb {
      width: 44px; height: 44px; border-radius: 6px; object-fit: cover;
      background: #1e2230; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #4b5263; overflow: hidden;
    }
    .queue-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .queue-info { flex: 1; min-width: 0; }
    .queue-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-size { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .queue-status { font-size: 11px; margin-top: 3px; }
    .queue-status.pending   { color: #6b7280; }
    .queue-status.uploading { color: #f59e0b; }
    .queue-status.done      { color: #22c55e; }
    .queue-status.review    { color: #fbbf24; }
    .queue-status.error     { color: #ef4444; }
    .queue-status.dup       { color: #a78bfa; }
    .queue-remove {
      background: none; border: none; color: #4b5263;
      font-size: 22px; padding: 4px 8px; flex-shrink: 0;
      cursor: pointer;
    }

    .btn-upload-all {
      width: 100%; padding: 16px; border-radius: 12px; margin-top: 14px;
      background: #5b8af9; border: none; color: #fff;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-upload-all:disabled { background: #2a2d36; color: #4b5263; }

    /* ── Per-upload edit panel (revealed after OCR completes) ── */
    .queue-edit {
      display: none;
      border-top: 1px solid #2a2d36;
      padding-top: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .qe-row { display: flex; flex-direction: column; gap: 4px; }
    .qe-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .qe-label {
      font-size: 10px; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .qe-input, .qe-select {
      width: 100%; padding: 10px 10px;
      background: #1e2230; color: #e8e9ec;
      border: 1px solid #2a2d36; border-radius: 8px;
      font-size: 16px; /* ≥16px to suppress iOS zoom */
      font-family: inherit;
    }
    .qe-select {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236b7280' d='M6 8L0 0h12z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px;
    }
    .qe-actions {
      display: flex; align-items: center; gap: 10px;
      margin-top: 2px;
    }
    .qe-save {
      flex: 1; padding: 12px;
      background: #1a3a2a; border: 1px solid #2a5a3a;
      color: #74c69d; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .qe-save:disabled { opacity: .5; cursor: not-allowed; }
    .qe-save.saving { background: #2a2d36; color: #6b7280; }
    .qe-save.saved  { background: #14291e; color: #22c55e; border-color: #1a4228; }
    .qe-save.failed { background: #2a1414; color: #ef4444; border-color: #4a2020; }
    .qe-confidence {
      font-size: 11px; color: #fbbf24; font-weight: 500;
    }
    .qe-confidence.high { color: #22c55e; }
    .qe-filed-as {
      font-size: 11px; color: #6b7280; font-style: italic;
      word-break: break-all;
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px; color: #4b5263; text-align: center;
    }
    .footer-note a { color: #6b7280; text-decoration: none; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">FP <span>Upload</span></div>
  <div class="topbar-right">
    <a href="{{ url_for('logout') }}" class="btn-sm">Sign out</a>
  </div>
</div>

<div class="wrap">

  <div class="page-title">Upload receipts &amp; docs</div>
  <div class="page-sub">Snap a photo or pick from your library. We'll file it automatically.</div>

  {% if not projects %}
    <div class="no-projects">
      You don't have access to any projects yet. Ask an admin to grant you access.
    </div>
  {% else %}
    <div class="field-label">Project</div>
    <select id="projectSelect" class="project-select">
      {% for p in projects %}
        <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>

    <div class="btn-stack">
      <button class="btn-big primary" type="button" onclick="openCamera()">
        <span class="ico">📷</span> Take Photo
      </button>
      <button class="btn-big" type="button" onclick="openLibrary()">
        <span class="ico">🖼</span> Choose from Library
      </button>
    </div>

    <input type="file" id="cameraInput"  accept="image/*" capture="environment" style="display:none">
    <input type="file" id="libraryInput" accept="image/*,application/pdf,.heic,.heif" multiple style="display:none">

    <div class="drop-zone" id="dropZone">
      <input type="file" id="dropInput" multiple accept="image/*,application/pdf,.heic,.heif">
      <div class="drop-icon">📎</div>
      <div class="drop-primary">Drop files here</div>
      <div class="drop-secondary">or <span>browse</span> · PDF, JPG, PNG, HEIC</div>
    </div>

    <div class="queue" id="uploadQueue"></div>
    <button class="btn-upload-all" id="btnUploadAll" disabled onclick="uploadAll()">Upload</button>
  {% endif %}

</div>

<script>
const LAST_PROJECT_KEY = "fpbudget.mobile_upload.last_project";

const sel = document.getElementById('projectSelect');
if (sel) {
  // Restore last-used project from localStorage if it's still in the list.
  try {
    const last = localStorage.getItem(LAST_PROJECT_KEY);
    if (last && [...sel.options].some(o => o.value === last)) {
      sel.value = last;
    }
  } catch (e) { /* private mode etc. — ignore */ }
  sel.addEventListener('change', () => {
    try { localStorage.setItem(LAST_PROJECT_KEY, sel.value); } catch (e) {}
  });
}

let queue = []; // { file, status, thumbUrl, uploadId, ocr: {...} }

// Doc Type options — mirrors the desktop dropdown (2026-05-11 taxonomy).
const DOC_TYPES = [
  { v: '',                label: '— unspecified —' },
  { v: 'receipt',         label: 'Receipt' },
  { v: 'invoice',         label: 'Invoice' },
  { v: 'estimate',        label: 'Estimate / Quote' },
  { v: 'purchase_order',  label: 'Purchase Order (PO)' },
  { v: 'contract',        label: 'Contract / SOW' },
  { v: 'insurance',       label: 'Insurance / COI' },
  { v: 'tax_form',        label: 'Tax Form (W-9, W-8, 1099)' },
  { v: 'payroll',         label: 'Payroll' },
  { v: 'legal',           label: 'Legal' },
  { v: 'release',         label: 'Release (Talent / Location)' },
  { v: 'misc',            label: 'Miscellaneous' },
];
// Legacy DocUpload rows tagged 'quote' or 'sow' map to the merged
// keys for the dropdown (matches desktop's _categoryAlias).
const CATEGORY_ALIAS = { quote: 'estimate', sow: 'contract' };

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function fileIcon(file) {
  if (file.type.startsWith('image/')) return '🖼️';
  if (file.type === 'application/pdf') return '📄';
  return '📎';
}

function _fmtMoney(v) {
  if (v === '' || v == null) return '';
  const n = parseFloat(String(v).replace(/,/g, ''));
  if (!isFinite(n)) return '';
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function _parseMoney(v) {
  if (v == null) return '';
  const cleaned = String(v).replace(/,/g, '').trim();
  if (cleaned === '') return '';
  const n = parseFloat(cleaned);
  return isFinite(n) ? String(n) : '';
}

function _statusBadge(item) {
  if (item.status === 'uploading') return { text: 'Uploading…',       cls: 'uploading' };
  if (item.status === 'done')      return { text: 'Filed ✓',          cls: 'done' };
  if (item.status === 'review')    return { text: 'Needs review',     cls: 'review' };
  if (item.status === 'duplicate') return { text: 'Already uploaded', cls: 'dup' };
  if (item.status === 'error')     return { text: item.error || 'Failed', cls: 'error' };
  return { text: 'Ready', cls: 'pending' };
}

function renderQueue() {
  const el = document.getElementById('uploadQueue');
  el.innerHTML = '';
  queue.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'queue-item';

    let thumbHtml = `<div class="queue-thumb">${fileIcon(item.file)}</div>`;
    if (item.thumbUrl) {
      thumbHtml = `<div class="queue-thumb"><img alt="" src="${item.thumbUrl}"></div>`;
    }

    const status = _statusBadge(item);
    const removeBtn = (item.status === 'uploading') ? '' :
      `<button class="queue-remove" aria-label="Remove" onclick="removeItem(${idx})">×</button>`;

    // Header row — thumb, filename, size, status, remove. The filename
    // goes in via textContent below to neutralise any HTML in user
    // filenames; the rest is template-controlled.
    const header = document.createElement('div');
    header.className = 'queue-row';
    header.innerHTML = `
      ${thumbHtml}
      <div class="queue-info">
        <div class="queue-name"></div>
        <div class="queue-size">${formatSize(item.file.size)}</div>
        <div class="queue-status ${status.cls}">${status.text}</div>
      </div>
      ${removeBtn}`;
    header.querySelector('.queue-name').textContent = item.file.name;
    div.appendChild(header);

    // Edit panel — shown once OCR has completed (done or review). Lets
    // the user fix vendor / amount / date / doc-type inline without
    // bouncing to the desktop docs page. Mirrors a limited subset of
    // the desktop doc-detail modal's fields.
    if ((item.status === 'done' || item.status === 'review') && item.uploadId) {
      const ocr = item.ocr || {};
      const conf = Math.round((ocr.confidence || 0) * 100);
      const filedAs = item.filedFilename || ocr.new_filename || '';
      const docTypeKey = CATEGORY_ALIAS[(ocr.doc_type || '').toLowerCase()] || ocr.doc_type || '';
      const optionsHtml = DOC_TYPES.map(o =>
        `<option value="${o.v}"${o.v === docTypeKey ? ' selected' : ''}>${o.label}</option>`
      ).join('');
      const edit = document.createElement('div');
      edit.className = 'queue-edit';
      edit.innerHTML = `
        ${filedAs ? `<div class="qe-filed-as" title="Final filename in Dropbox"></div>` : ''}
        ${item.status === 'review'
          ? `<div class="qe-confidence">⚠ Low OCR confidence (${conf}%) — please confirm the fields below.</div>`
          : (conf >= 90 ? `<div class="qe-confidence high">OCR confidence ${conf}%</div>`
                        : `<div class="qe-confidence">OCR confidence ${conf}%</div>`)
        }
        <div class="qe-row">
          <span class="qe-label">Vendor</span>
          <input class="qe-input" type="text" data-field="vendor" value="">
        </div>
        <div class="qe-grid">
          <div class="qe-row">
            <span class="qe-label">Amount</span>
            <input class="qe-input qe-amount" type="text" inputmode="decimal" data-field="amount" value="">
          </div>
          <div class="qe-row">
            <span class="qe-label">Doc Date</span>
            <input class="qe-input" type="date" data-field="doc_date" value="">
          </div>
        </div>
        <div class="qe-row">
          <span class="qe-label">Doc Type</span>
          <select class="qe-select" data-field="category">${optionsHtml}</select>
        </div>
        <div class="qe-row">
          <span class="qe-label">Doc #</span>
          <input class="qe-input" type="text" data-field="doc_number" value="" placeholder="—">
        </div>
        <div class="qe-actions">
          <button class="qe-save" onclick="saveEdit(${idx})">Save changes</button>
        </div>`;
      // textContent for the filename — same XSS guard pattern as the
      // header row above.
      if (filedAs) edit.querySelector('.qe-filed-as').textContent = `Filed as: ${filedAs}`;
      edit.querySelector('[data-field="vendor"]').value     = ocr.vendor || '';
      edit.querySelector('[data-field="amount"]').value     = ocr.amount != null ? _fmtMoney(ocr.amount) : '';
      edit.querySelector('[data-field="doc_date"]').value   = ocr.doc_date || '';
      edit.querySelector('[data-field="doc_number"]').value = ocr.doc_number || '';
      // Comma-format the amount on blur, strip on focus.
      const amtEl = edit.querySelector('.qe-amount');
      amtEl.addEventListener('focus', () => { amtEl.value = String(amtEl.value).replace(/,/g, ''); });
      amtEl.addEventListener('blur',  () => { amtEl.value = _fmtMoney(amtEl.value); });
      div.appendChild(edit);
    }

    el.appendChild(div);
  });
  const anyPending = queue.some(i => i.status === 'pending');
  document.getElementById('btnUploadAll').disabled = !anyPending;
}

async function saveEdit(idx) {
  const item = queue[idx];
  if (!item || !item.uploadId) return;
  const wrap = document.getElementById('uploadQueue').children[idx];
  const btn  = wrap.querySelector('.qe-save');
  if (!btn) return;
  const payload = {
    vendor:     wrap.querySelector('[data-field="vendor"]').value,
    amount:     _parseMoney(wrap.querySelector('[data-field="amount"]').value),
    doc_date:   wrap.querySelector('[data-field="doc_date"]').value,
    category:   wrap.querySelector('[data-field="category"]').value,
    doc_number: wrap.querySelector('[data-field="doc_number"]').value,
  };
  btn.disabled = true;
  btn.className = 'qe-save saving';
  btn.textContent = 'Saving…';
  try {
    const r = await fetch(`/docs/upload/${item.uploadId}/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || `HTTP ${r.status}`);
    }
    btn.className = 'qe-save saved';
    btn.textContent = 'Saved ✓';
    // Keep the local OCR cache in sync so a subsequent renderQueue
    // (eg. after adding more files) preserves the edits.
    item.ocr = Object.assign({}, item.ocr, {
      vendor: payload.vendor || null,
      amount: payload.amount === '' ? null : parseFloat(payload.amount),
      doc_date: payload.doc_date || null,
      doc_type: payload.category || null,
      doc_number: payload.doc_number || null,
    });
  } catch (e) {
    btn.className = 'qe-save failed';
    btn.textContent = 'Save failed — tap to retry';
    btn.disabled = false;
    console.warn('[mobile_upload] save edit failed', e);
  }
}

function removeItem(idx) {
  if (queue[idx] && queue[idx].status === 'uploading') return;
  queue.splice(idx, 1);
  renderQueue();
}

function addFiles(files) {
  for (const f of files) {
    const item = { file: f, status: 'pending', thumbUrl: null };
    if (f.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = e => { item.thumbUrl = e.target.result; renderQueue(); };
      reader.readAsDataURL(f);
    }
    queue.push(item);
  }
  renderQueue();
}

function openCamera()  { document.getElementById('cameraInput').click(); }
function openLibrary() { document.getElementById('libraryInput').click(); }

document.getElementById('cameraInput').addEventListener('change', function () {
  addFiles(Array.from(this.files)); this.value = '';
});
document.getElementById('libraryInput').addEventListener('change', function () {
  addFiles(Array.from(this.files)); this.value = '';
});

// Desktop drag-drop zone
const dropZone  = document.getElementById('dropZone');
const dropInput = document.getElementById('dropInput');
if (dropZone) {
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop',      e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    addFiles(Array.from(e.dataTransfer.files));
  });
  dropInput.addEventListener('change', () => {
    addFiles(Array.from(dropInput.files)); dropInput.value = '';
  });
}

async function uploadOne(item, pid) {
  item.status = 'uploading'; renderQueue();
  const fd = new FormData();
  fd.append('file', item.file);
  try {
    const resp = await fetch(`/docs/${pid}/upload`, { method: 'POST', body: fd });
    let data = {};
    try { data = await resp.json(); } catch (e) { /* may be empty */ }

    if (data && data.status === 'duplicate') {
      item.status = 'duplicate';
      item.uploadId = data.upload_id || null;
    } else if (resp.ok) {
      // Server returns DocUpload.status: 'done' | 'review' | 'error'.
      const s = (data && data.status) || 'done';
      item.status = (s === 'review') ? 'review' : (s === 'error' ? 'error' : 'done');
      if (s === 'error' && data.error) item.error = data.error;
      // Capture upload metadata so the edit panel can render and so
      // saveEdit can target the right DocUpload row.
      item.uploadId      = data.upload_id || null;
      item.filedFilename = data.new_filename || data.filed_filename || null;
      item.ocr = {
        vendor:     data.vendor || null,
        amount:     data.amount != null ? data.amount : null,
        doc_date:   data.doc_date || null,
        doc_number: data.doc_number || null,
        doc_type:   data.doc_type || null,
        confidence: data.confidence != null ? data.confidence : null,
        new_filename: data.new_filename || null,
      };
    } else {
      item.status = 'error';
      item.error  = (data && data.error) || `HTTP ${resp.status}`;
    }
  } catch (e) {
    item.status = 'error';
    item.error  = e.message || 'Network error';
  }
  renderQueue();
}

async function uploadAll() {
  const pid = sel.value;
  if (!pid) { alert('Pick a project first.'); return; }
  const pending = queue.filter(i => i.status === 'pending');
  for (const item of pending) {
    await uploadOne(item, pid);
  }
}
</script>
