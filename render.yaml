services:
  - type: web
    name: fp-budget
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Run migrations + seeds in a separate container BEFORE the web container
    # starts. This avoids blocking the gevent worker with synchronous psycopg2
    # calls — which was hanging deploys (worker couldn't answer health checks).
    preDeployCommand: RUN_BOOT_TASKS=1 python -c "import app"
    # gthread worker (2 processes × 8 threads = 16 concurrent slots).
    # Bumped back from 4 threads (2026-05-08) after user reported 502s
    # when navigating between budget tabs: each open browser tab parks
    # ~2 threads on /socket.io/?…polling for ~25s at a time, so 4 open
    # budgets saturated all 8 slots and starved page renders. The
    # earlier 4-thread cut was a response to OOMs during doc-upload
    # batches (Pillow holding 30+MB per image); 8 threads is the prior
    # known-good value. If OOM recurs, raise instance memory before
    # cutting threads again — saturation is the worse failure mode.
    #
    # gthread = real OS threads inside each worker. No gevent
    # monkey-patching, no SSL recursion, no dependency drama.
    #
    # --max-requests 100 --max-requests-jitter 20: each worker will
    # voluntarily recycle after handling 80–120 requests. Sheds
    # accumulated memory (SQLAlchemy session caches, ORM identity
    # maps, big budget renders held in tracebacks, etc.) before
    # Render's OOM killer hits. Without this, workers grow until
    # they cross 512MB and Render terminates them mid-request, which
    # the user sees as random instance failures. With this, the
    # other worker (still pid-stable) continues serving while the
    # one being recycled is replaced. The jitter avoids both workers
    # cycling at the exact same moment. 2026-05-10.
    # 2026-05-29: raised --max-requests 100 → 5000. The old value (set for
    # the 512MB instance to dodge the OOM killer) made each worker recycle
    # after ~100 requests — but socket.io long-polling + the /live poll
    # (every 10s) + presence (every 20s) generate requests so fast that
    # workers were recycling every couple minutes, and each respawn re-imports
    # the (large) app module → visible stalls while typing/changing dropdowns.
    # We're on 2GB/1CPU now, so memory pressure no longer justifies aggressive
    # recycling. 5000 still sheds long-lived leaks, far less churn.
    startCommand: gunicorn -k gthread -w 2 --threads 8 --bind 0.0.0.0:$PORT --timeout 120 --max-requests 5000 --max-requests-jitter 500 app:app
    # /readyz does a real SELECT 1 — a deploy is only "healthy" when the DB is
    # reachable (audit C4; /health was a static "ok" that green-lit dead deploys)
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
