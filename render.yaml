services:
  - type: web
    name: fp-budget
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Run migrations + seeds in a separate container BEFORE the web container
    # starts. This avoids blocking the gevent worker with synchronous psycopg2
    # calls — which was hanging deploys (worker couldn't answer health checks).
    preDeployCommand: RUN_BOOT_TASKS=1 python -c "import app"
    # gthread worker (2 processes × 8 threads = 16 concurrent slots).
    # Bumped back from 4 threads (2026-05-08) after user reported 502s
    # when navigating between budget tabs: each open browser tab parks
    # ~2 threads on /socket.io/?…polling for ~25s at a time, so 4 open
    # budgets saturated all 8 slots and starved page renders. The
    # earlier 4-thread cut was a response to OOMs during doc-upload
    # batches (Pillow holding 30+MB per image); 8 threads is the prior
    # known-good value. If OOM recurs, raise instance memory before
    # cutting threads again — saturation is the worse failure mode.
    #
    # gthread = real OS threads inside each worker. No gevent
    # monkey-patching, no SSL recursion, no dependency drama.
    startCommand: gunicorn -k gthread -w 2 --threads 8 --bind 0.0.0.0:$PORT --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
